tool_risk:
  high_risk:
    - transfer_funds
    - delete_record
    - send_external_email

baseline:
  z_threshold: 3.0
  baseline_window_events: 50

correlation:
  window_seconds: 300

severity_weights:
  scope_violation: 4
  missing_approval: 4
  origin_mismatch: 4
  baseline_deviation: 2

severity_levels:
  LOW:
    min: 1
    max: 3
  MEDIUM:
    min: 4
    max: 5
  HIGH:
    min: 6
    max: 7
  CRITICAL:
    min: 8
    max: 9999
